[package]
name    = "universal-weave-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
universal-weave = { git = "https://github.com/transkatgirl/universal-weave.git", rev = "a64f01a783e94916c452b7f6fca1a47bcde0088c", features = [
	"layout",
	"rkyv",
	"serde",
	"loro",
] }
universal-weave-layout = { git = "https://github.com/transkatgirl/universal-weave-layout.git" }
eframe = "0.35"
rfd = "0.17"
rkyv = { version = "0.8.17", features = [
	"bytecheck",
] }

[patch.crates-io]
universal-weave = { git = "https://github.com/transkatgirl/universal-weave.git", rev = "a64f01a783e94916c452b7f6fca1a47bcde0088c" }
